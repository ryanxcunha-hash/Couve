<style>

:root:not([data-theme="light"]) .hero{color:#052e16}

<script>
var NAME='Ryan',LK='couve-v1',view='home',per='t',flt='all',cargas=[],db=null,shared=false,editId=null,added=[],lastPrice='',clis=[],buyer='',fb='all';
var $=function(s){return document.querySelector(s)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function brl(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(v){return v.toLocaleString('pt-BR',{maximumFractionDigits:2})}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function pnum(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'))}
try{cargas=JSON.parse(localStorage.getItem(LK)||'[]');lastPrice=localStorage.getItem(LK+'-p')||''}catch(e){}
try{var cj=localStorage.getItem(LK+'-cli');clis=cj?JSON.parse(cj):['Maurício','Agro Pinheiro']}catch(e){clis=['Maurício','Agro Pinheiro']}
var qs=[50,100];
try{var qj=localStorage.getItem(LK+'-qs');if(qj){var qa0=JSON.parse(qj);if(Array.isArray(qa0)&&qa0.length)qs=qa0}}catch(e){}
function saveQs(){try{localStorage.setItem(LK+'-qs',JSON.stringify(qs))}catch(e){}}
function qsHTML(){return '<div class="chips" style="margin:-4px 0 12px">'+qs.map(function(n){return '<button class="chip" data-qa="'+n+'">+'+num(n)+'</button>'}).join('')+'<button class="chip" data-qa="0">Zerar</button></div>'}
function appV(){var m=document.querySelector('meta[name="app-version"]');return (m&&m.content)||''}
function updCard(){return '<div class="card"><b>Atualizar o app</b><p style="color:var(--mut);margin:6px 0 10px">Busca a versão mais recente do site, como um F5. Seus dados não são apagados.</p><button class="btn" id="upd">🔄 Atualizar app</button><div id="updmsg" class="pill" style="margin-top:8px"></div><div class="pill">Versão '+esc(appV())+'</div></div>'}
function qsCard(){return '<div class="card"><b>Atalhos de quantidade</b><div style="color:var(--mut);font-size:13px;margin:4px 0">Aparecem ao lançar uma carga. Cada toque soma na quantidade.</div>'+qs.map(function(n){return '<div class="item"><span>'+num(n)+' un.</span><button class="x" data-rq="'+n+'">✕</button></div>'}).join('')+'<div class="row" style="margin-top:8px"><input id="cfgq" inputmode="decimal" placeholder="Nova quantidade" style="margin:0"><button class="btn" style="width:auto;padding:12px 16px" data-aq="1">Adicionar</button></div></div>'}
function saveCli(){try{localStorage.setItem(LK+'-cli',JSON.stringify(clis))}catch(e){}}
function addCli(n){n=String(n||'').trim();if(!n)return '';var f=clis.filter(function(x){return x.toLowerCase()===n.toLowerCase()})[0];if(f)return f;clis.push(n);saveCli();return n}
function buyerHTML(){return clis.map(function(n){return '<button class="chip'+(n===buyer?' sel':'')+'" data-b="'+esc(n)+'">'+esc(n)+'</button>'}).join('')}
function cliCard(){return '<div class="card"><b>Compradores</b>'+clis.map(function(n){return '<div class="item"><span>'+esc(n)+'</span><button class="x" data-rc="'+esc(n)+'">✕</button></div>'}).join('')+'<div class="row" style="margin-top:8px"><input id="cfgnb" placeholder="Novo comprador" style="margin:0"><button class="btn" style="width:auto;padding:12px 16px" data-cnb="1">Adicionar</button></div></div>'}
var gastos=[],gcats=['Adubo','Diesel','Mão de obra','Outros'],bp={},gper='m',gcat='',editG=null,lastMark=[];
try{var gj=localStorage.getItem(LK+'-g');if(gj){var g0=JSON.parse(gj);if(Array.isArray(g0))gastos=g0}}catch(e){}
try{var gcj=localStorage.getItem(LK+'-gc');if(gcj){var g1=JSON.parse(gcj);if(Array.isArray(g1)&&g1.length)gcats=g1}}catch(e){}
try{var bj=localStorage.getItem(LK+'-bp');if(bj){var b0=JSON.parse(bj);if(b0&&typeof b0==='object')bp=b0}}catch(e){}
function saveG(){try{localStorage.setItem(LK+'-g',JSON.stringify(gastos))}catch(e){}}
function saveGc(){try{localStorage.setItem(LK+'-gc',JSON.stringify(gcats))}catch(e){}}
function saveBp(){try{localStorage.setItem(LK+'-bp',JSON.stringify(bp))}catch(e){}}
function addGcat(n){n=String(n||'').trim();if(!n)return '';var f=gcats.filter(function(x){return x.toLowerCase()===n.toLowerCase()})[0];if(f)return f;gcats.push(n);saveGc();return n}
function gcatHTML(){return gcats.map(function(n){return '<button class="chip'+(n===gcat?' sel':'')+'" data-gc="'+esc(n)+'">'+esc(n)+'</button>'}).join('')}
function gcatCard(){return '<div class="card"><b>Categorias de gastos</b>'+gcats.map(function(n){return '<div class="item"><span>'+esc(n)+'</span><button class="x" data-gcr="'+esc(n)+'">✕</button></div>'}).join('')+'<div class="row" style="margin-top:8px"><input id="gcfg" placeholder="Nova categoria" style="margin:0"><button class="btn" style="width:auto;padding:12px 16px" data-gca="1">Adicionar</button></div></div>'}
function gIn(d){if(gper==='t')return true;var r=mrange(gper==='m'?0:-1);return d>=r[0]&&d<=r[1]}
function gLabel(){return gper==='m'?'este mês':gper==='pm'?'mês passado':'no total'}
function gList(){return gastos.filter(function(g){return gIn(g.d)}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id.localeCompare(a.id)})}
function gItem(g){return '<div class="item"><div class="main" data-gedit="'+esc(g.id)+'">'+esc(g.c||'Sem categoria')+(g.rid?' 🔁':'')+'<small>'+fdate(g.d)+(g.n?' · '+esc(g.n):'')+'</small></div><div class="row"><b>'+brl(g.v)+'</b><button class="x" data-gdel="'+esc(g.id)+'">✕</button></div></div>'}
function gastosHTML(){
 var gl=gList(),gt=gl.reduce(function(a,g){return a+g.v},0),vt=tot(cargas.filter(function(c){return gIn(c.d)})).v,lu=vt-gt;
 var h='<h1>Gastos</h1><div style="color:var(--mut);margin-bottom:12px">Adubo, diesel, mão de obra e outros.</div><div class="seg">'+[['m','Este mês'],['pm','Mês passado'],['t','Total']].map(function(x){return '<button data-gp="'+x[0]+'" class="'+(gper===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
 h+='<div class="card hero"><small>Lucro — '+gLabel()+'</small><div class="huge">'+brl(lu)+'</div><div class="hr"></div><div class="row sp"><div><small>Vendas</small><div class="mid">'+brl(vt)+'</div></div><div style="text-align:right"><small>Gastos</small><div class="mid">'+brl(gt)+'</div></div></div></div>';
 h+='<div class="card"><small class="pill">Sua parte do lucro (metade)</small><div><b>'+brl(lu/2)+'</b></div></div>';
 var by={};gl.forEach(function(g){var k=g.c||'Sem categoria';by[k]=by[k]||{v:0,n:0};by[k].v+=g.v;by[k].n++});
 var bk=Object.keys(by).sort(function(a,b){return by[b].v-by[a].v});
 h+='<h2>Gastos por categoria</h2><div class="card">'+(bk.map(function(k){return '<div class="item"><div class="main">'+esc(k)+'<small>'+by[k].n+(by[k].n===1?' lançamento':' lançamentos')+' · '+Math.round(by[k].v/gt*100)+'%</small></div><b>'+brl(by[k].v)+'</b></div>'}).join('')||'<small style="color:var(--mut)">Nenhum gasto neste período.</small>')+'</div>';
 if(grec.length){var fq={w:'toda semana',m:'todo mês'};h+='<h2>Gastos que se repetem</h2><div class="card">'+grec.map(function(r){return '<div class="item"><div class="main">'+esc(r.c||'Sem categoria')+(r.n?' · '+esc(r.n):'')+'<small>'+fq[r.freq]+(r.freq==='w'?' ('+['dom','seg','ter','qua','qui','sex','sáb'][r.day]+')':' (dia '+r.day+')')+'</small></div><div class="row"><b>'+brl(r.v)+'</b><button class="x" data-grdel="'+esc(r.id)+'">✕</button></div></div>'}).join('')+'</div>'}
 h+='<h2>Lançamentos ('+gl.length+')</h2><div class="card">'+(gl.map(gItem).join('')||'<small style="color:var(--mut)">Toque no + para lançar um gasto.</small>')+'</div>';
 return h}
function openGasto(id){editG=id||null;gfreq='';var g=gastos.filter(function(x){return x.id===id})[0]||{};
 if(g.id)gcat=g.c||'';else{try{gcat=localStorage.getItem(LK+'-gl')||''}catch(e){gcat=''}if(gcats.indexOf(gcat)<0)gcat=gcats[0]||''}
 $('#shc').innerHTML='<div class="row sp"><h1>'+(g.id?'Editar gasto':'Novo gasto')+'</h1><button class="xc" data-close="1" aria-label="Fechar">✕</button></div><label>Valor (R$)</label><input id="gv" inputmode="decimal" placeholder="0,00" value="'+(g.v!=null?String(g.v).replace('.',','):'')+'"><label>Categoria</label><div class="chips" id="gcs" style="flex-wrap:wrap;margin:4px 0 8px">'+gcatHTML()+'</div><div class="row" style="margin-bottom:10px"><input id="gnc" placeholder="Nova categoria" style="margin:0"><button class="btn" style="width:auto;padding:12px 16px" data-gnc="1">Adicionar</button></div><label>Data</label><div class="row"><button class="btn ghost" style="width:52px;padding:12px 0;margin:4px 0 10px" data-gdd="-1">‹</button><input id="gd" type="date" value="'+(g.d||today())+'"><button class="btn ghost" style="width:52px;padding:12px 0;margin:4px 0 10px" data-gdd="1">›</button></div><label>Observação (opcional)</label><input id="gn" value="'+esc(g.n||'')+'">'+(g.id?'':'<label>Repetir</label><div class="chips" id="gfr" style="margin:4px 0 12px">'+gfreqHTML()+'</div>')+'<button class="btn" id="gs">Salvar</button><div style="height:8px"></div><button class="btn ghost" id="fcx">Cancelar</button>';
 $('#sh').classList.add('open');if(!g.id)setTimeout(function(){$('#gv').focus()},50)}
function persistC(ids){if(db){cargas.forEach(function(c){if(!ids||ids.indexOf(c.id)>=0)db.collection('cargas').doc(c.id).set(c).catch(function(){})})}else saveLocal()}
function backupObj(){return{app:'couve',v:2,em:new Date().toISOString(),cargas:cargas,gastos:gastos,clis:clis,qs:qs,gcats:gcats,bp:bp,lastPrice:lastPrice,grec:grec,pix:pix}}
function saveBackup(){var s=JSON.stringify(backupObj()),name='couve-backup-'+today()+'.json';
 try{var blob=new Blob([s],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return}
  if(window.claude){claude.use('downloads').then(function(dl){if(dl)dl.save({filename:name,data:s});else prompt('Copie:',s)}).catch(function(){prompt('Copie:',s)});return}
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
 catch(e){prompt('Copie:',s)}}
function okDate(x){return typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)}
function restoreData(txt){var o;try{o=JSON.parse(txt)}catch(e){return{ok:0,msg:'Texto inválido. Confira se o backup foi copiado inteiro.'}}
 if(Array.isArray(o))o={cargas:o};
 if(!o||typeof o!=='object'||!Array.isArray(o.cargas))return{ok:0,msg:'Isso não parece um backup do Couve.'};
 var nc=0,ng=0,bad=0;
 o.cargas.forEach(function(c){var q=c?+c.q:NaN,pr=c?+c.p:NaN;if(!c||typeof c.id!=='string'||!okDate(c.d)||!(q>0)||!(pr>=0)||!isFinite(q)||!isFinite(pr)){bad++;return}
  var n={id:c.id,q:q,p:pr,d:c.d,n:String(c.n||''),b:String(c.b||''),ok:!!c.ok},i=cargas.findIndex(function(x){return x.id===n.id});if(i<0){cargas.push(n);nc++}else cargas[i]=n});
 (Array.isArray(o.gastos)?o.gastos:[]).forEach(function(g){var v=g?+g.v:NaN;if(!g||typeof g.id!=='string'||!okDate(g.d)||!(v>0)||!isFinite(v)){bad++;return}
  var n={id:g.id,d:g.d,v:v,c:String(g.c||''),n:String(g.n||'')},i=gastos.findIndex(function(x){return x.id===n.id});if(i<0){gastos.push(n);ng++}else gastos[i]=n});
 function un(arr,list){(Array.isArray(arr)?arr:[]).forEach(function(x){x=String(x||'').trim();if(x&&!list.some(function(y){return y.toLowerCase()===x.toLowerCase()}))list.push(x)})}
 un(o.clis,clis);un(o.gcats,gcats);
 if(Array.isArray(o.qs))o.qs.forEach(function(x){x=+x;if(x>0&&isFinite(x)&&qs.indexOf(x)<0)qs.push(x)});qs.sort(function(a,b){return a-b});
 if(o.bp&&typeof o.bp==='object')Object.keys(o.bp).forEach(function(k){if(bp[k]==null&&o.bp[k]!=null)bp[k]=String(o.bp[k])});
 if(!lastPrice&&o.lastPrice){lastPrice=String(o.lastPrice);try{localStorage.setItem(LK+'-p',lastPrice)}catch(e){}}
 (Array.isArray(o.grec)?o.grec:[]).forEach(function(r){var v=r?+r.v:NaN;if(!r||typeof r.id!=='string'||!(v>0)||(r.freq!=='w'&&r.freq!=='m')||!okDate(r.last)){bad++;return}if(!grec.some(function(x){return x.id===r.id}))grec.push({id:r.id,v:v,c:String(r.c||''),n:String(r.n||''),freq:r.freq,day:Math.max(0,Math.min(31,+r.day||0)),last:r.last})});
 if(o.pix&&typeof o.pix==='object'&&!pix.key&&o.pix.key){pix={key:String(o.pix.key),name:String(o.pix.name||''),city:String(o.pix.city||''),val:o.pix.val!==false};savePix()}
 persistC(null);saveG();saveGr();saveCli();saveQs();saveGc();saveBp();
 return{ok:1,msg:'Pronto! '+nc+(nc===1?' carga nova':' cargas novas')+' e '+ng+(ng===1?' gasto novo':' gastos novos')+' adicionados.'+(bad?' '+bad+' itens incompletos foram ignorados.':'')}}
function openRestore(){$('#shc').innerHTML='<div class="row sp"><h1>Restaurar backup</h1><button class="xc" data-close="1" aria-label="Fechar">✕</button></div><div style="color:var(--mut);font-size:14px;margin:6px 0 12px">Escolha o arquivo do backup ou cole o texto copiado. Os dados do backup são somados aos atuais e nada é apagado.</div><label>Arquivo de backup</label><input id="rfile" type="file" accept=".json,application/json,text/plain"><label>Ou cole o backup aqui</label><textarea id="rtxt" rows="4" style="width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 10px"></textarea><div id="rmsg" class="pill" style="margin-bottom:10px"></div><button class="btn" id="rgo">Restaurar</button><div style="height:8px"></div><button class="btn ghost" id="fcx">Fechar</button>';$('#sh').classList.add('open')}
var grec=[],pix={key:'',name:'',city:'',val:true},gfreq='';
try{var grj=localStorage.getItem(LK+'-gr');if(grj){var gr0=JSON.parse(grj);if(Array.isArray(gr0))grec=gr0}}catch(e){}
