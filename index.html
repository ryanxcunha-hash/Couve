<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Couve"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-v3.png"><link rel="icon" href="icon-v3.png">
<meta name="theme-color" content="#15803d"><title>Couve</title>
<style>
:root{--bg:#f3f8f4;--card:#fff;--tx:#10241a;--mut:#64748b;--pri:#15803d;--ok:#16a34a;--warn:#d97706;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b140f;--card:#13221a;--tx:#e8f3ec;--mut:#94a3b8;--pri:#4ade80;--bd:#21352a;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{padding-bottom:150px}main{max-width:560px;margin:auto;padding:14px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:15px;color:var(--mut);margin:18px 0 8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.hero{background:var(--pri);color:#fff;border:0}.hero small{opacity:.85}.big{font-size:32px;font-weight:700;margin:4px 0}.huge{font-size:46px;font-weight:800;line-height:1.05;margin:4px 0 12px}.hr{height:1px;background:currentColor;opacity:.25;margin:0 0 12px}.mid{font-size:22px;font-weight:700}.okmsg{background:var(--pri);color:#fff;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;margin-bottom:10px}:root:not([data-theme="light"]) .okmsg{color:#052e16}
:root:not([data-theme="light"]) .hero{color:#052e16}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:10px 2px;border-radius:10px;color:var(--mut);font-size:15px;font-weight:600}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0002}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:20px;font-size:14px}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.btn{width:100%;border:0;background:var(--pri);color:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:600}
:root:not([data-theme="light"]) .btn{color:#052e16}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx)}
.item{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item small{color:var(--mut);display:block}.item .main{flex:1;min-width:0}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;border:1px solid var(--warn);color:var(--warn);background:none}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:0 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 4px;color:var(--mut);font-size:12px}nav button b{display:block;font-size:20px}nav button.on{color:var(--pri)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 14px #0004;z-index:6}
:root:not([data-theme="light"]) .fab{color:#052e16}
.sheet{position:fixed;inset:0;background:#0007;z-index:10;display:none;align-items:flex-end}.sheet.open{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px;max-height:90%;overflow:auto;box-sizing:border-box}
.pill{font-size:12px;color:var(--mut)}
.chip.sel{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
:root:not([data-theme="light"]) .chip.sel{color:#052e16}
:root:not([data-theme="light"]) .btn.ghost{color:var(--tx)}
.xc{border:0;background:var(--bg);color:var(--tx);width:38px;height:38px;border-radius:50%;font-size:20px;flex:none}
</style></head><body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Nova carga">+</button>
<nav><button data-v="home"><b>🥬</b>Início</button><button data-v="list"><b>🧾</b>Cargas</button><button data-v="rep"><b>📊</b>Relatório</button><button data-v="cfg"><b>⚙️</b>Ajustes</button></nav>
<div class="sheet" id="sh"><div id="shc"></div></div>
<script>
var NAME='Ryan',LK='couve-v1',view='home',per='d',flt='all',cargas=[],db=null,shared=false,editId=null,added=[],lastPrice='',clis=[],buyer='',fb='all';
var $=function(s){return document.querySelector(s)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function brl(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(v){return v.toLocaleString('pt-BR',{maximumFractionDigits:2})}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function pnum(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'))}
try{cargas=JSON.parse(localStorage.getItem(LK)||'[]');lastPrice=localStorage.getItem(LK+'-p')||''}catch(e){}
try{var cj=localStorage.getItem(LK+'-cli');clis=cj?JSON.parse(cj):['Maurício','Agro Pinheiro']}catch(e){clis=['Maurício','Agro Pinheiro']}
function saveCli(){try{localStorage.setItem(LK+'-cli',JSON.stringify(clis))}catch(e){}}
function addCli(n){n=String(n||'').trim();if(!n)return '';var f=clis.filter(function(x){return x.toLowerCase()===n.toLowerCase()})[0];if(f)return f;clis.push(n);saveCli();return n}
function buyerHTML(){return clis.map(function(n){return '<button class="chip'+(n===buyer?' sel':'')+'" data-b="'+esc(n)+'">'+esc(n)+'</button>'}).join('')}
function cliCard(){return '<div class="card"><b>Compradores</b>'+clis.map(function(n){return '<div class="item"><span>'+esc(n)+'</span><button class="x" data-rc="'+esc(n)+'">✕</button></div>'}).join('')+'<div class="row" style="margin-top:8px"><input id="cfgnb" placeholder="Novo comprador" style="margin:0"><button class="btn" style="width:auto;padding:12px 16px" data-cnb="1">Adicionar</button></div></div>'}
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify(cargas))}catch(e){}}
function put(c){var i=cargas.findIndex(function(x){return x.id===c.id});if(i<0)cargas.push(c);else cargas[i]=c;
 if(db){db.collection('cargas').doc(c.id).set(c).catch(function(){})}else saveLocal();render()}
function del(id){cargas=cargas.filter(function(x){return x.id!==id});if(db){db.collection('cargas').doc(id).delete().catch(function(){})}else saveLocal();render()}
function weekStart(){var d=new Date(today()+'T12:00:00'),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.toISOString().slice(0,10)}
function inPer(c,p){var t=today();if(p==='t')return true;return p==='d'?c.d===t:p==='w'?c.d>=weekStart()&&c.d<=t:c.d.slice(0,7)===t.slice(0,7)}
function tot(l){var q=0,v=0;l.forEach(function(c){q+=c.q;v+=c.q*c.p});return{q:q,v:v}}
function fdate(d){return d.split('-').reverse().join('/')}
function item(c){var v=c.q*c.p;return '<div class="item"><div class="main" data-edit="'+c.id+'">'+num(c.q)+' un. × '+brl(c.p)+' = <b>'+brl(v)+'</b><small>'+fdate(c.d)+(c.b?' · '+esc(c.b):'')+(c.n?' · '+esc(c.n):'')+'</small></div><div class="row"><button class="tag'+(c.ok?' ok':'')+'" data-ok="'+c.id+'">'+(c.ok?'✓ Recebido':'A receber')+'</button><button class="x" data-del="'+c.id+'">✕</button></div></div>'}
var rsel='m',rf='',rt='',rdays=[],rb='all',rpend=false;
function iso(d){return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function mrange(o){var n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+o,1),b=new Date(n.getFullYear(),n.getMonth()+o+1,0);return[iso(a),iso(b)]}
function setRp(k){rsel=k;var r;if(k==='m'){r=mrange(0);rf=r[0];rt=r[1]}else if(k==='pm'){r=mrange(-1);rf=r[0];rt=r[1]}else if(k==='30'){var e=new Date();e.setDate(e.getDate()-29);rf=iso(e);rt=today()}else if(k==='custom'&&(!rf||!rt)){r=mrange(0);rf=r[0];rt=r[1]}}
setRp('m');
function repList(){return cargas.filter(function(c){var okd=rsel==='days'?rdays.indexOf(c.d)>=0:(c.d>=rf&&c.d<=rt);return okd&&(rb==='all'||c.b===rb)}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id.localeCompare(a.id)})}
function repHTML(){
 var l=repList(),t=tot(l),pend=tot(l.filter(function(c){return !c.ok})),shown=rpend?l.filter(function(c){return !c.ok}):l,h='<h1>Relatório</h1><div style="color:var(--mut);margin-bottom:12px">Veja as vendas de um período.</div>';
 h+='<div class="chips" style="margin-bottom:10px">'+[['m','Este mês'],['pm','Mês passado'],['30','Últimos 30 dias'],['custom','Escolher datas'],['days','Dias específicos']].map(function(x){return '<button class="chip'+(rsel===x[0]?' sel':'')+'" data-rp="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
 if(rsel==='custom')h+='<div class="card"><div class="row"><div style="flex:1"><label>De</label><input id="rfi" type="date" value="'+rf+'"></div><div style="flex:1"><label>Até</label><input id="rti" type="date" value="'+rt+'"></div></div></div>';
 else if(rsel==='days')h+='<div class="card"><label>Escolha um dia e toque em Adicionar</label><div class="row"><input id="rdi" type="date" value="'+today()+'" style="margin:4px 0"><button class="btn" style="width:auto;padding:12px 16px" data-rad="1">Adicionar</button></div><div class="chips" style="flex-wrap:wrap;margin-top:8px">'+(rdays.map(function(x){return '<button class="chip sel" data-rdd="'+x+'">'+fdate(x)+' ✕</button>'}).join('')||'<small style="color:var(--mut)">Nenhum dia escolhido.</small>')+'</div></div>';
 else h+='<div class="pill" style="margin-bottom:10px">'+fdate(rf)+' até '+fdate(rt)+'</div>';
 h+='<div class="chips" style="margin-bottom:10px"><button class="chip'+(rb==='all'?' sel':'')+'" data-rbf="all">Todos</button>'+clis.map(function(n){return '<button class="chip'+(rb===n?' sel':'')+'" data-rbf="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'<button class="chip'+(rpend?' sel':'')+'" data-rpt="1">Só a receber</button></div>';
 h+='<div class="card hero"><small>Sua parte (metade)</small><div class="big">'+brl(t.v/2)+'</div><div class="row sp"><div><small>Valor total</small><div><b>'+brl(t.v)+'</b></div></div><div style="text-align:right"><small>Vendido</small><div><b>'+num(t.q)+' un.</b></div></div></div></div>';
 h+='<div class="card"><small class="pill">Falta receber</small><div><b>'+brl(pend.v)+'</b> <span class="pill">· metade '+brl(pend.v/2)+'</span></div></div>';
 var by={};l.forEach(function(c){var k=c.b||'Sem comprador';by[k]=by[k]||{q:0,v:0,r:0};by[k].q+=c.q;by[k].v+=c.q*c.p;if(!c.ok)by[k].r+=c.q*c.p});
 var bk=Object.keys(by).sort(function(a,b){return by[b].v-by[a].v});
 h+='<h2>Vendas por comprador</h2><div class="card">'+(bk.map(function(k){return '<div class="item"><div class="main">'+esc(k)+'<small>'+num(by[k].q)+' un.'+(by[k].r>0?' · a receber '+brl(by[k].r):'')+'</small></div><b>'+brl(by[k].v)+'</b></div>'}).join('')||'<small style="color:var(--mut)">Nenhuma venda neste período.</small>')+'</div>';
 h+='<h2>Cargas do período ('+shown.length+')</h2><div class="card">'+(shown.map(item).join('')||'<small style="color:var(--mut)">Nada por aqui.</small>')+'</div>';
 return h}
function render(){var h='';
 if(view==='home'){var h2=new Date().getHours(),g=h2<12?'Bom dia':h2<18?'Boa tarde':'Boa noite',l=cargas.filter(function(c){return inPer(c,per)}),t=tot(l),pend=tot(cargas.filter(function(c){return !c.ok}));
  var pl={d:'hoje',w:'na semana',m:'no mês',t:'no total'}[per];
  var by={};l.forEach(function(c){var k=c.b||'Sem comprador';by[k]=by[k]||{q:0,v:0,r:0};by[k].q+=c.q;by[k].v+=c.q*c.p;if(!c.ok)by[k].r+=c.q*c.p});
  var bk=Object.keys(by).sort(function(a,b){return by[b].v-by[a].v});
  var bh='<h2>Vendas por comprador — '+pl+'</h2><div class="card">'+(bk.map(function(k){return '<div class="item"><div class="main">'+esc(k)+'<small>'+num(by[k].q)+' un.'+(by[k].r>0?' · a receber '+brl(by[k].r):'')+'</small></div><b>'+brl(by[k].v)+'</b></div>'}).join('')||'<small style="color:var(--mut)">Nenhuma venda neste período.</small>')+'</div>';
  h+='<h1>Olá '+NAME+' 👋</h1><div style="color:var(--mut)">'+g+'! Veja a couve colhida.</div><div class="seg" style="margin-top:12px"><button data-p="t" class="'+(per==='t'?'on':'')+'">Total</button><button data-p="d" class="'+(per==='d'?'on':'')+'">Dia</button><button data-p="w" class="'+(per==='w'?'on':'')+'">Semana</button><button data-p="m" class="'+(per==='m'?'on':'')+'">Mês</button></div>'+
  '<div class="card hero"><small>Sua parte (metade) — '+pl+'</small><div class="huge">'+brl(t.v/2)+'</div><div class="hr"></div><div class="row sp"><div><small>Valor total</small><div class="mid">'+brl(t.v)+'</div></div><div style="text-align:right"><small>Colhido '+pl+'</small><div class="mid">'+num(t.q)+' un.</div></div></div></div>'+
  '<div class="card row sp"><div><small class="pill">Ainda a receber (geral)</small><div><b>'+brl(pend.v)+'</b> <span class="pill">· metade '+brl(pend.v/2)+'</span></div></div></div>'+
  bh+'<h2>Últimas cargas</h2><div class="card">'+(cargas.slice().sort(function(a,b){return b.d.localeCompare(a.d)||b.id.localeCompare(a.id)}).slice(0,5).map(item).join('')||'<small style="color:var(--mut)">Nenhuma carga ainda. Toque no +</small>')+'</div>'}
 else if(view==='list'){var l2=cargas.filter(function(c){return (flt==='all'||(flt==='p'?!c.ok:c.ok))&&(fb==='all'||c.b===fb)}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id.localeCompare(a.id)}),ls=tot(l2);
  h+='<div class="seg"><button data-f="all" class="'+(flt==='all'?'on':'')+'">Todas</button><button data-f="p" class="'+(flt==='p'?'on':'')+'\">A receber</button><button data-f="o" class="'+(flt==='o'?'on':'')+'">Recebidos</button></div><div class="chips" style="margin-bottom:10px"><button class="chip'+(fb==='all'?' sel':'')+'" data-fb="all">Todos</button>'+clis.map(function(n){return '<button class="chip'+(fb===n?' sel':'')+'" data-fb="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div><div class="card"><small class="pill">'+l2.length+' cargas · '+num(ls.q)+' un.</small><div class="mid">'+brl(ls.v)+'</div></div><div class="card">'+(l2.map(item).join('')||'<small style="color:var(--mut)">Nada por aqui.</small>')+'</div>'}
 else if(view==='rep'){h+=repHTML()}
 else{h+=cliCard()+'<div class="card"><b>Seus dados</b><p style="color:var(--mut);margin:6px 0 0">As cargas ficam salvas neste aparelho. Faça backup de vez em quando.</p></div>'+
  '<div class="card"><button class="btn ghost" id="exp">Baixar backup dos dados</button><div style="height:8px"></div><button class="btn ghost" id="cp">Copiar backup</button></div>'}
 $('#app').innerHTML=h;document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});$('#fab').style.display=(view==='cfg'||view==='rep')?'none':''}
function openForm(id){editId=id||null;added=[];var c=cargas.filter(function(x){return x.id===id})[0]||{};
 if(c.id)buyer=c.b||'';else{try{buyer=localStorage.getItem(LK+'-b')||''}catch(e){buyer=''}}
 $('#shc').innerHTML='<div class="row sp"><h1>'+(c.id?'Editar carga':'Nova carga')+'</h1><button class="xc" data-close="1" aria-label="Fechar">✕</button></div><div id="fmsg"></div><label>Quantidade (un.)</label><input id="fq" inputmode="decimal" placeholder="0" value="'+(c.q!=null?String(c.q).replace('.',','):'')+'"><label>Preço por unidade (R$)</label><input id="fp" inputmode="decimal" placeholder="0,00" value="'+(c.p!=null?String(c.p).replace('.',','):lastPrice)+'"><div id="ft" class="pill" style="margin:-4px 0 10px"></div><label>Data</label><div class="row"><button class="btn ghost" style="width:52px;padding:12px 0;margin:4px 0 10px" data-dd="-1">‹</button><input id="fd" type="date" value="'+(c.d||today())+'"><button class="btn ghost" style="width:52px;padding:12px 0;margin:4px 0 10px" data-dd="1">›</button></div><label>Comprador</label><div class="chips" id="fbs" style="flex-wrap:wrap;margin:4px 0 8px">'+buyerHTML()+'</div><div class="row" style="margin-bottom:10px"><input id="fnb" placeholder="Novo comprador" style="margin:0"><button class="btn" style="width:auto;padding:12px 16px" data-nb="1">Adicionar</button></div><label>Observação (opcional)</label><input id="fn" value="'+esc(c.n||'')+'">'+(c.id?'<button class="btn" id="fs">Salvar</button><div style="height:8px"></div><button class="btn ghost" id="fcx">Cancelar</button>':'<button class="btn" id="fs">Salvar e adicionar outra</button><div style="height:8px"></div><button class="btn ghost" id="fcx">Concluir</button>')+'<div id="fadd"></div>';
 $('#sh').classList.add('open');upd();if(!c.id)setTimeout(function(){$('#fq').focus()},50)}
function upd(){var q=pnum($('#fq').value),p=pnum($('#fp').value);$('#ft').textContent=(q>0&&p>=0)?'Total '+brl(q*p)+' · metade '+brl(q*p/2):''}
function showAdded(){var a=added[0];$('#fmsg').innerHTML=a?'<div class="okmsg">✓ Carga salva · '+num(a.q)+' un. em '+fdate(a.d)+'</div>':'';
 $('#fadd').innerHTML=added.length?'<h2>Adicionadas agora ('+added.length+')</h2>'+added.map(function(c){return '<div class="item"><div class="main">'+num(c.q)+' un. × '+brl(c.p)+' = <b>'+brl(c.q*c.p)+'</b><small>'+fdate(c.d)+(c.b?' · '+esc(c.b):'')+'</small></div></div>'}).join(''):''}
function closeSheet(){$('#sh').classList.remove('open')}
document.addEventListener('input',function(e){if(e.target.id==='fq'||e.target.id==='fp')upd()});
document.addEventListener('click',function(e){var t=e.target,d=t.dataset||{};
 if(t.id==='sh'||t.id==='fcx'||t.closest('[data-close]'))return closeSheet();
 if(d.dd){var x=new Date($('#fd').value+'T12:00:00');if(isNaN(x))x=new Date(today()+'T12:00:00');x.setDate(x.getDate()+parseInt(d.dd,10));$('#fd').value=x.toISOString().slice(0,10);return}
 if(d.b!==undefined){buyer=(buyer===d.b)?'':d.b;$('#fbs').innerHTML=buyerHTML();return}
 if(d.nb){var n1=addCli($('#fnb').value);if(n1){buyer=n1;$('#fbs').innerHTML=buyerHTML();$('#fnb').value=''}return}
 if(d.fb!==undefined){fb=d.fb;return render()}
 if(d.cnb){addCli($('#cfgnb').value);return render()}
 if(d.rc!==undefined){if(confirm('Remover este comprador da lista? As cargas já lançadas continuam com o nome.')){clis=clis.filter(function(x){return x!==d.rc});saveCli();if(fb===d.rc)fb='all';render()}return}
 if(t.closest('nav')&&t.closest('button')){view=t.closest('button').dataset.v;return render()}
 if(t.id==='fab')return openForm();
 if(d.rp){setRp(d.rp);return render()}
 if(d.rbf!==undefined){rb=d.rbf;return render()}
 if(d.rpt){rpend=!rpend;return render()}
 if(d.rad){var dv=$('#rdi').value;if(dv&&rdays.indexOf(dv)<0){rdays.push(dv);rdays.sort()}return render()}
 if(d.rdd){rdays=rdays.filter(function(x){return x!==d.rdd});return render()}
